version: "3.9"

services:
  # Base Postgres pour n8n (workflows, credentials, etc.)
  postgres_n8n:
    image: postgres:16-alpine
    container_name: postgres_n8n
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - ./data/postgres_n8n:/var/lib/postgresql/data
    networks:
      - urbanhub_net

  # Base Postgres pour ton projet IoT (Silver / Gold)
  postgres_iot:
    image: postgres:16-alpine
    container_name: postgres_iot
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot
    ports:
      - "5433:5432"   # accès local: host=localhost, port=5433
    volumes:
      - ./data/postgres_iot:/var/lib/postgresql/data
    networks:
      - urbanhub_net

  # n8n (ne gère plus le Bronze, sert éventuellement à d'autres workflows)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin

      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n

      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      # plus besoin de N8N_RESTRICT_FILE_ACCESS_TO pour le Bronze
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios,qs
    depends_on:
      - postgres_n8n
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - urbanhub_net

  # (Optionnel) MinIO pour ton futur data lake
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - urbanhub_net

networks:
  urbanhub_net:
    driver: bridge