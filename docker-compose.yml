version: '3.8'

services:
  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: urbanhub_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    volumes:
      - ./data/minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - urbanhub_network

  # PostgreSQL (analytique pour BI)
  postgres:
    image: postgres:15-alpine
    container_name: urbanhub_postgres
    environment:
      POSTGRES_DB: urbanhub
      POSTGRES_USER: urbanhub_user
      POSTGRES_PASSWORD: urbanhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanhub_user -d urbanhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbanhub_network

  # n8n (Orchestration & cron)
  n8n:
    image: n8nio/n8n:latest
    container_name: urbanhub_n8n
    environment:
      - DB_TYPE=postgres
      - DB_POSTGRE_HOST=postgres
      - DB_POSTGRE_PORT=5432
      - DB_POSTGRE_DATABASE=n8n
      - DB_POSTGRE_USER=n8n_user
      - DB_POSTGRE_PASSWORD=n8n_password
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - urbanhub_network

  # UrbanHub Pipeline (Docker)
  urbanhub_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanhub_pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - USE_MINIO=false
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=urbanhub
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=urbanhub
      - POSTGRES_USER=urbanhub_user
      - POSTGRES_PASSWORD=urbanhub_password
    volumes:
      - ./data/lake:/app/data/lake
      - ./logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - urbanhub_network
    profiles:
      - pipeline

volumes:
  minio_data:
  postgres_data:
  n8n_data:

networks:
  urbanhub_network:
    driver: bridge
